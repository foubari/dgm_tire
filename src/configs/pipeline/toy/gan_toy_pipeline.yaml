model:
  type: gan
  channels: null
  image_size:
  - 64
  - 32
  latent_dim_per_component: 4
  dim: 64
  dim_mults:
  - 1
  - 2
  - 4
  label_smoothing: 0.1
  use_spectral_norm: true
  cond_drop_prob: 0.1
  cond_dim: null
data:
  root_dir: data/toy_epure
  condition_csv: data/toy_epure/performances_1000.csv
  component_dirs:
  - group_nc
  - group_km
  - fpu
  condition_columns:
  - d_cons_norm
  - d_rigid_norm
  - d_life_norm
  - d_stab_norm
  prefix_column: matching
  filename_pattern: '{prefix}_{component}.png'
  split_column: train
  normalized: true
training:
  epochs: 100
  batch_size: 64
  num_workers: 4
  lr_generator: 0.0002
  lr_discriminator: 0.0002
  beta1: 0.5
  beta2: 0.999
  optimizer: adam
  ema_decay: 0.9999
  ema_update_every: 10
  eval_every: 10
  check_every: 25
  seed: 0
paths:
  output_dir: outputs/gan_toy/
  samples_dir: samples/gan_toy/
sampling:
  num_samples: 1000
  batch_sz: 8
  guidance_scale: 2.0
  mode: conditional
  components:
  - group_nc
  - group_km
